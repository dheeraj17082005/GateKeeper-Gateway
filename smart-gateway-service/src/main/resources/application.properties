spring.application.name=smart-gateway-service
server.port=${PORT:8080}

info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security, and traffic management

management.api.username=gateway-service
management.api.password=${GATEKEEPER_GATEWAY_PASSWORD:gateway123}
management.api.base-url=${GATEKEEPER_MANAGEMENT_URL:http://localhost:8081}

gateway.kafka.enabled=${GATEKEEPER_KAFKA_ENABLED:true}
gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway.kafka.configuration-group=${GATEKEEPER_CONFIGURATION_GROUP:smart-gateway-configuration}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.data.redis.host=${GATEKEEPER_REDIS_HOST:localhost}
spring.data.redis.port=${GATEKEEPER_REDIS_PORT:6379}
spring.data.redis.password=${GATEKEEPER_REDIS_PASSWORD:}
spring.data.redis.timeout=2s

gateway.allowed-upstreams=${GATEKEEPER_ALLOWED_UPSTREAMS:http://localhost:8082,http://demo-backend:80,https://dummyjson.com,https://jsonplaceholder.typicode.com}
