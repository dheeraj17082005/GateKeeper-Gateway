spring.application.name=api-management-service
server.port=${PORT:8081}

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=${GATEKEEPER_DB_URL:jdbc:h2:mem:gatekeeper_management;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${GATEKEEPER_DB_USER:sa}
spring.datasource.password=${GATEKEEPER_DB_PASSWORD:}
spring.datasource.driverClassName=${GATEKEEPER_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${GATEKEEPER_DDL_AUTO:create-drop}
spring.flyway.enabled=${GATEKEEPER_FLYWAY_ENABLED:false}

security.jwt.expiration-seconds=3600
security.jwt.secret=${GATEKEEPER_JWT_SECRET:4f9b8c2e1a7d6e5f0b3c8a9e2d1f4a7c6b5e0d3f2a1c8e7b6d5a4f3e2c1b0a9f}

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}



spring.jpa.open-in-view=false
