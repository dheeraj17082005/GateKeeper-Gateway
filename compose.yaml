name: gatekeeper

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gatekeeper_management
      MYSQL_USER: gatekeeper
      MYSQL_PASSWORD: ${GATEKEEPER_DB_PASSWORD:?Set GATEKEEPER_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${GATEKEEPER_DB_ROOT_PASSWORD:?Set GATEKEEPER_DB_ROOT_PASSWORD}
    volumes:
      - management-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - policy-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-management:
    build:
      context: .
      args:
        SERVICE: api-management-service
    environment:
      GATEKEEPER_DB_URL: jdbc:mysql://mysql:3306/gatekeeper_management?allowPublicKeyRetrieval=true&sslMode=DISABLED
      GATEKEEPER_DB_PASSWORD: ${GATEKEEPER_DB_PASSWORD:?Set GATEKEEPER_DB_PASSWORD}
      GATEKEEPER_JWT_SECRET: ${GATEKEEPER_JWT_SECRET:?Set GATEKEEPER_JWT_SECRET}
      GATEKEEPER_ADMIN_PASSWORD: ${GATEKEEPER_ADMIN_PASSWORD:?Set GATEKEEPER_ADMIN_PASSWORD}
      GATEKEEPER_GATEWAY_PASSWORD: ${GATEKEEPER_GATEWAY_PASSWORD:?Set GATEKEEPER_GATEWAY_PASSWORD}
      GATEKEEPER_KAFKA_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  smart-gateway:
    build:
      context: .
      args:
        SERVICE: smart-gateway-service
    environment:
      GATEKEEPER_GATEWAY_PASSWORD: ${GATEKEEPER_GATEWAY_PASSWORD:?Set GATEKEEPER_GATEWAY_PASSWORD}
      GATEKEEPER_MANAGEMENT_URL: http://api-management:8081
      GATEKEEPER_KAFKA_SERVERS: kafka:9092
      GATEKEEPER_REDIS_HOST: redis
      GATEKEEPER_ALLOWED_UPSTREAMS: ${GATEKEEPER_ALLOWED_UPSTREAMS:-http://demo-backend:80}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api-management:
        condition: service_started
      redis:
        condition: service_healthy
      demo-backend:
        condition: service_started

  analytics:
    build:
      context: .
      args:
        SERVICE: analytics-service
    ports:
      - "127.0.0.1:8082:8082"

  demo-backend:
    image: nginx:alpine
    volumes:
      - ./demo-backend/catalog.json:/usr/share/nginx/html/catalog.json:ro

volumes:
  management-data:
  policy-data:
